<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITAN Spotlight</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
    }
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
    }
    .spotlight-container {
      width: 100%;
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 229, 255, 0.2);
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-app-region: drag;
    }
    .input-bar {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      gap: 14px;
    }
    .arc-reactor {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, #00e5ff 30%, #0077b6 80%);
      box-shadow: 0 0 12px #00e5ff;
      flex-shrink: 0;
      animation: pulse 2.5s infinite alternate;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 8px #00e5ff; }
      100% { box-shadow: 0 0 18px #00e5ff, 0 0 28px rgba(0, 229, 255, 0.4); }
    }
    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f0f6fc;
      font-size: 17px;
      font-weight: 500;
      -webkit-app-region: no-drag;
    }
    input::placeholder {
      color: #8b949e;
      font-size: 15px;
    }
    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #8b949e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      -webkit-app-region: no-drag;
    }
    .mic-btn {
      background: transparent;
      border: none;
      color: #00e5ff;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s;
      -webkit-app-region: no-drag;
    }
    .mic-btn:hover {
      background: rgba(0, 229, 255, 0.15);
    }
    .result-pane {
      display: none;
      max-height: 280px;
      overflow-y: auto;
      padding: 12px 18px 16px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #c9d1d9;
      font-size: 14px;
      line-height: 1.5;
      -webkit-app-region: no-drag;
    }
    .result-pane.active {
      display: block;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0, 229, 255, 0.3);
      border-radius: 50%;
      border-top-color: #00e5ff;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spotlight-container" id="container">
    <div class="input-bar">
      <div class="arc-reactor"></div>
      <input type="text" id="spotlight-input" placeholder="Ask TITAN, open software, write code, or adjust system..." autofocus />
      <button class="mic-btn" id="mic-btn" title="Speak command">🎙️</button>
      <span class="badge">ESC to close</span>
    </div>
    <div class="result-pane" id="result-pane"></div>
  </div>

  <script>
    const input = document.getElementById('spotlight-input');
    const resultPane = document.getElementById('result-pane');
    const micBtn = document.getElementById('mic-btn');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.pywebview.api.hide_spotlight();
      } else if (e.key === 'Enter') {
        execute();
      }
    });

    micBtn.addEventListener('click', async () => {
      micBtn.style.color = '#ff4757';
      resultPane.classList.add('active');
      resultPane.innerHTML = '<span class="spinner"></span>Listening for your command, Sir...';
      try {
        const text = await window.pywebview.api.listen_voice();
        micBtn.style.color = '#00e5ff';
        if (text) {
          input.value = text;
          execute();
        } else {
          resultPane.innerHTML = 'No speech detected.';
        }
      } catch (err) {
        micBtn.style.color = '#00e5ff';
        resultPane.innerHTML = 'Microphone error: ' + err;
      }
    });

    async function execute() {
      const q = input.value.trim();
      if (!q) return;

      resultPane.classList.add('active');
      resultPane.innerHTML = '<span class="spinner"></span>TITAN is executing...';

      try {
        const res = await window.pywebview.api.execute_command(q);
        resultPane.innerHTML = res.replace(/\\n/g, '<br/>');
      } catch (err) {
        resultPane.innerHTML = '<span style="color:#ff6b6b">Error: ' + err + '</span>';
      }
    }
  </script>
</body>
</html>
